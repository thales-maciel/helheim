global
    nbthread 2
    maxconn 4096

defaults
    mode tcp
    timeout connect 1s
    timeout client 10s
    timeout server 10s
    no log

frontend http_in
    bind *:9999
    default_backend api_servers

backend api_servers
    balance roundrobin
    # L4 round-robin (mode tcp): per-connection balancing, no HTTP parsing or
    # connection reuse — lighter per request than mode http. Health check still
    # probes /ready over HTTP and expects 204.
    option httpchk GET /ready
    http-check expect status 204
    server api1 api1:8080 check inter 3s
    server api2 api2:8080 check inter 3s
