global
    nbthread 2
    maxconn 4096

defaults
    mode http
    timeout connect 1s
    timeout client 10s
    timeout server 10s
    option http-keep-alive
    no log

frontend http_in
    bind *:9999
    default_backend api_servers

backend api_servers
    balance roundrobin
    # Reuse pooled backend connections for any incoming request (key win vs a
    # per-request connection). Pairs with keep-alive on both sides.
    http-reuse always
    # Active health check; /ready returns 204, so expect exactly that.
    option httpchk GET /ready
    http-check expect status 204
    server api1 api1:8080 check inter 3s
    server api2 api2:8080 check inter 3s
